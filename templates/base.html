<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Min Flask-side{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
</head>

<body>

    <nav>
        <a href="{{ url_for('home') }}">Hjem</a>
        <a href="{{ url_for('om') }}">Om meg</a>
        <a href="{{ url_for('kontakt') }}">Kontakt</a>
        <a href="{{ url_for('skjema') }}">Skjema</a>
        <a href="{{ url_for('oppgaver') }}">Oppgaver</a>
        <a href="{{ url_for('matlogg') }}">Matlogg</a>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Aktiver mørk modus" aria-pressed="false">
            <span aria-hidden="true">🌙</span>
            <span class="theme-toggle-text">Mørk modus</span>
        </button>
    </nav>

    {% with meldinger = get_flashed_messages() %}
        {% if meldinger %}
            {% for melding in meldinger %}
                <p>{{ melding }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</body>
</html>
