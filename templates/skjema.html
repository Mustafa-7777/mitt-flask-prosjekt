{% extends "base.html" %}

{% block title %}Skjema{% endblock %}

{% block content %}
    <h1>Send en melding</h1>

    <form method="POST" action="{{ url_for('skjema') }}">
        <label for="navn">Navn</label>
        <input type="text" id="navn" name="navn" value="{{ navn|default('') }}" required>

        <label for="epost">E-post</label>
        <input type="email" id="epost" name="epost" value="{{ epost|default('') }}" required>

        <label for="melding">Melding</label>
        <textarea id="melding" name="melding" rows="5" required>{{ melding|default('') }}</textarea>

        <button type="submit">Send melding</button>
    </form>

    {% if feil %}
        <p>{{ feil }}</p>
    {% endif %}

{% endblock %}
